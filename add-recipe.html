<!DOCTYPE html>
<html lang="he" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="add-recipe.css">
</head>

<body>
    <form action="#" method="get">
        <h1>הוספת מתכון</h1>
        <div class="field">
            <label for="title">שם המתכון</label>
            <input type="text" id="title" name="title" placeholder="למשל: עוגת תפוחים" required>
        </div>

        <fieldset>
            <legend>סוג המנה</legend>
            <div class="options">
                <span class="option">
                    <input type="radio" id="meat" name="kind" value="meat">
                    <label for="meat">בשרי</label>
                </span>
                <span class="option">
                    <input type="radio" id="dairy" name="kind" value="dairy">
                    <label for="dairy">חלבי</label>
                </span>
                <span class="option">
                    <input type="radio" id="prave" name="kind" value="prave">
                    <label for="prave">פרווה</label>
                </span>
            </div>
        </fieldset>

        <div class="row">
            <div class="field">
                <label for="category">קטגוריה</label>
                <select name="category" id="category">
                    <option>מרקים</option>
                    <option>עקריות</option>
                    <option>סלטים</option>
                    <option>מאפים</option>
                    <option>קינוחים</option>
                </select>
            </div>  
        </div>

            <div class="field">
                <label for="time">זמן הכנה</label>
                <input type="time" id="time" name="time"  value="00:10" max="05:00" required>
            </div>

            <div class="field">
                <label for="servings">מספר מנות</label>
                <input type="number" id="servings" name="servings" min="1" max="50" value="4">
            </div>
        </div>

        <div class="field">
            <label for="ingredients">מצרכים</label>
            <textarea name="ingredients" id="ingredients" rows="5"  placeholder="מצרך אחד בכל שורה" required></textarea>
        </div>

        <div class="field">
            <label for="steps">אופן ההכנה</label>
            <textarea name="steps" id="steps" rows="6" required></textarea>
        </div>

        <fieldset>
            <legend>מתאים ל...</legend>
                <div class="options">
                    <span class="option">
                        <input type="checkbox" id="holydays" name="suitableFor" value="holydays">
                        <label for="holydays">חגים</label>
                    </span>
                    <span class="option">
                        <input type="checkbox" id="kids" name="suitableFor" value="kids">
                        <label for="kids">ילדים</label>
                    </span>
                    <span class="option">
                        <input type="checkbox" id="quick" name="suitableFor" value="quick">
                        <label for="quick">הכנה מהירה</label>
                    </span>
                </div>
        </fieldset>

        <div class="field">
            <label for="img">תמונה של המנה</label>
            <input type="file" accept="image/*" id="img" name="img">
        </div>

        <div class="field">
            <label for="sending">שליחה</label>
            <button type="submit" id="sending" name="sending">שמירת המתכון</button>
        </div>
    </form>
</body>

</html>
